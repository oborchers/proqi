name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read # Locate and download the exact cross-run candidate artifact.
      artifact-metadata: write # Register tag-bound artifact attestations.
      attestations: write # Verify candidate claims and publish tag-bound claims.
      contents: write # Create or resume the immutable GitHub Release.
      id-token: write # Sign tag-bound attestations with GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-dist@0.32.0
      - name: Validate immutable tag
        run: cargo xtask release-plan "$GITHUB_REF_NAME"
      - id: candidate
        name: Locate exact successful candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          artifact_name="release-candidate-${TAG}"
          run_id=""
          while read -r candidate_run; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${artifact_name}\" and .expired == false) | .id" | head -n 1)"
            if [[ -n "$artifact_id" ]]; then
              run_id="$candidate_run"
              break
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-candidate.yml/runs?event=workflow_dispatch&status=success&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          if [[ -z "$run_id" ]]; then
            echo "No unexpired successful candidate exists for ${TAG} at ${GITHUB_SHA}. Delete the tag, dispatch Release candidate for that exact tag and commit, then recreate the tag." >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: target/release-assets
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
      - name: Verify manifest and every candidate byte
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run-id }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release-assets
          jq -e --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg run_id "$CANDIDATE_RUN_ID" \
            '.schema_version == 2 and .tag == $tag and .source_sha == $sha and .build_run_id == ($run_id | tonumber) and .workflow == "release-candidate.yml" and .targets == ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"] and (.release_files | length == 14) and (.evidence_files | length == 4)' \
            candidate-manifest.json
          jq -r '.release_files[].name, .evidence_files[].name, "candidate-manifest.json"' candidate-manifest.json | sort > "$RUNNER_TEMP/expected-candidate-files"
          find . -type f -printf '%P\n' | sort > "$RUNNER_TEMP/actual-candidate-files"
          diff -u "$RUNNER_TEMP/expected-candidate-files" "$RUNNER_TEMP/actual-candidate-files"
          jq -r '.release_files[], .evidence_files[] | "\(.sha256)  \(.name)"' candidate-manifest.json | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          ruby -c proqi.rb
      - name: Verify candidate attestations against the source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in target/release-assets/*.tar.gz target/release-assets/proqi_amd64.deb; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Bind provenance to the protected release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/release-assets/*.tar.gz
            target/release-assets/proqi_amd64.deb
      - name: Bind Apple silicon SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-aarch64-apple-darwin.tar.gz
          sbom-path: target/release-assets/proqi-aarch64-apple-darwin.tar.gz.spdx.json
      - name: Bind Intel macOS SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-x86_64-apple-darwin.tar.gz
          sbom-path: target/release-assets/proqi-x86_64-apple-darwin.tar.gz.spdx.json
      - name: Bind Linux SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: target/release-assets/proqi-x86_64-unknown-linux-gnu.tar.gz.spdx.json
      - name: Bind Debian SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi_amd64.deb
          sbom-path: target/release-assets/proqi_amd64.deb.spdx.json
      - name: Create, resume, or confirm the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release-assets
          mapfile -t assets < <(jq -r '.release_files[].name' candidate-manifest.json | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for asset in "${assets[@]}"; do
              test -f "$existing/$asset"
              cmp "$asset" "$existing/$asset"
            done
            test "$(find "$existing" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#assets[@]}"
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" = "false" ]]; then
              echo "Release $TAG already contains the exact candidate bytes."
              exit 0
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --notes-file "$GITHUB_WORKSPACE/.github/release-notes/${TAG}.md" \
              --title "Proqi $TAG" --verify-tag "${assets[@]}"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - id: tap-token
        name: Create scoped tap notification token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_SYNC_APP_PRIVATE_KEY }}
          owner: oborchers
          repositories: homebrew-tap
          permission-contents: write
      - name: Wake Homebrew tap synchronization
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_REPOSITORY: oborchers/homebrew-tap
        run: |
          gh api --method POST "repos/${TAP_REPOSITORY}/dispatches" \
            -f event_type=proqi_release_published \
            -F "client_payload[tag]=${GITHUB_REF_NAME}" \
            -F "client_payload[source_sha]=${GITHUB_SHA}"
