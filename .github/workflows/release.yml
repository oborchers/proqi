name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and verify release candidate
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      actions: read # Inspect the successful main CI run and exchange artifacts.
      artifact-metadata: write # Register immutable candidate artifacts.
      attestations: write # Publish candidate provenance and SBOM attestations.
      contents: read
      id-token: write # Sign candidate attestations with GitHub OIDC.

  promote:
    name: Promote verified candidate
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read # Download the exact candidate artifact from this run.
      artifact-metadata: write # Register tag-bound artifact attestations.
      attestations: write # Verify candidate claims and publish tag-bound claims.
      contents: write # Create or resume the immutable GitHub Release.
      id-token: write # Sign tag-bound attestations with GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-dist@0.32.0
      - name: Validate immutable tag
        run: cargo xtask release-plan "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: target/release-assets
      - name: Verify manifest and every candidate byte
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release-assets
          jq -e --arg tag "$TAG" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '.schema_version == 3 and .tag == $tag and .source_ref == $ref and .source_sha == $sha and .build_run_id == ($run_id | tonumber) and .workflow == "release-candidate.yml" and .targets == ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"] and (.release_files | length == 14) and (.evidence_files | length == 4)' \
            candidate-manifest.json
          jq -r '.release_files[].name, .evidence_files[].name, "candidate-manifest.json"' candidate-manifest.json | sort > "$RUNNER_TEMP/expected-candidate-files"
          find . -type f -printf '%P\n' | sort > "$RUNNER_TEMP/actual-candidate-files"
          diff -u "$RUNNER_TEMP/expected-candidate-files" "$RUNNER_TEMP/actual-candidate-files"
          jq -r '.release_files[], .evidence_files[] | "\(.sha256)  \(.name)"' candidate-manifest.json | shasum -a 256 -c -
          shasum -a 256 -c SHA256SUMS
          ruby -c proqi.rb
      - name: Verify candidate attestations against the source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in target/release-assets/*.tar.gz target/release-assets/proqi_amd64.deb; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Bind provenance to the protected release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/release-assets/*.tar.gz
            target/release-assets/proqi_amd64.deb
      - name: Bind Apple silicon SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-aarch64-apple-darwin.tar.gz
          sbom-path: target/release-assets/proqi-aarch64-apple-darwin.tar.gz.spdx.json
      - name: Bind Intel macOS SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-x86_64-apple-darwin.tar.gz
          sbom-path: target/release-assets/proqi-x86_64-apple-darwin.tar.gz.spdx.json
      - name: Bind Linux SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: target/release-assets/proqi-x86_64-unknown-linux-gnu.tar.gz.spdx.json
      - name: Bind Debian SBOM to the release tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/proqi_amd64.deb
          sbom-path: target/release-assets/proqi_amd64.deb.spdx.json
      - id: github_release
        name: Create or verify the immutable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release-assets
          mapfile -t assets < <(jq -r '.release_files[].name' candidate-manifest.json | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for asset in "${assets[@]}"; do
              test -f "$existing/$asset"
              cmp "$asset" "$existing/$asset"
            done
            test "$(find "$existing" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#assets[@]}"
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" = "false" ]]; then
              echo "Release $TAG already contains the exact candidate bytes."
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --notes-file "$GITHUB_WORKSPACE/.github/release-notes/${TAG}.md" \
              --title "Proqi $TAG" --verify-tag "${assets[@]}"
            draft=true
          fi
          echo "is_draft=$draft" >> "$GITHUB_OUTPUT"
      - id: registry
        name: Verify the registry candidate and publication state
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          evidence="target/release-assets/evidence/crate"
          crate="proqi-${version}.crate"
          jq -e --arg version "$version" --arg crate "$crate" \
            '.schema_version == 1 and .package == "proqi" and .version == $version and .registry == "crates-io" and .crate == $crate and (.sha256 | test("^[0-9a-f]{64}$"))' \
            "$evidence/crate-evidence.json"
          expected_sha="$(jq -r '.sha256' "$evidence/crate-evidence.json")"
          test "$(shasum -a 256 "$evidence/$crate" | cut -d ' ' -f 1)" = "$expected_sha"
          cargo package --locked
          cmp "target/package/$crate" "$evidence/$crate"

          response="$RUNNER_TEMP/crates-io-version.json"
          status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
            --user-agent "proqi-release/${version}" "https://crates.io/api/v1/crates/proqi/${version}")"
          case "$status" in
            200)
              jq -e --arg version "$version" '.version.num == $version and .version.yanked == false' "$response"
              curl --fail --silent --show-error --location --user-agent "proqi-release/${version}" \
                --output "$RUNNER_TEMP/$crate" "https://crates.io/api/v1/crates/proqi/${version}/download"
              test "$(shasum -a 256 "$RUNNER_TEMP/$crate" | cut -d ' ' -f 1)" = "$expected_sha"
              publish_required=false
              ;;
            404)
              publish_required=true
              ;;
            *)
              echo "crates.io returned unexpected HTTP status $status" >&2
              exit 1
              ;;
          esac
          {
            echo "crate=$crate"
            echo "expected_sha=$expected_sha"
            echo "publish_required=$publish_required"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - id: crates_auth
        name: Create short-lived crates.io publishing token
        if: steps.registry.outputs.publish_required == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - id: crates_publish
        name: Publish the verified crate
        if: steps.registry.outputs.publish_required == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set +e
          cargo publish --locked
          status=$?
          set -e
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
      - name: Verify the public crates.io installation
        env:
          CRATE: ${{ steps.registry.outputs.crate }}
          EXPECTED_SHA: ${{ steps.registry.outputs.expected_sha }}
          PUBLISH_EXIT: ${{ steps.crates_publish.outputs.exit_status }}
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          response="$RUNNER_TEMP/crates-io-published.json"
          published="$RUNNER_TEMP/published-$CRATE"
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
              --user-agent "proqi-release/${VERSION}" "https://crates.io/api/v1/crates/proqi/${VERSION}")"
            if [[ "$status" = "200" ]] && jq -e --arg version "$VERSION" \
              '.version.num == $version and .version.yanked == false' "$response" >/dev/null; then
              curl --fail --silent --show-error --location --user-agent "proqi-release/${VERSION}" \
                --output "$published" "https://crates.io/api/v1/crates/proqi/${VERSION}/download"
              if [[ "$(shasum -a 256 "$published" | cut -d ' ' -f 1)" = "$EXPECTED_SHA" ]]; then
                break
              fi
            fi
            if [[ "$attempt" = "30" ]]; then
              echo "crates.io did not expose the exact verified crate before the deadline (cargo publish exit ${PUBLISH_EXIT:-not-run})" >&2
              exit 1
            fi
            sleep 5
          done

          cargo_home="$RUNNER_TEMP/registry-cargo-home"
          install_root="$RUNNER_TEMP/registry-install"
          CARGO_HOME="$cargo_home" cargo install proqi --version "=$VERSION" --locked --root "$install_root"
          binary="$install_root/bin/proqi"
          test "$("$binary" --version)" = "proqi $VERSION"
          PROQI_DISABLE_HERDR=1 "$binary" capabilities --json \
            | jq -e '.schema_version == 1 and .ok == true and (.data.commands | index("sessions"))'
          PROQI_DISABLE_HERDR=1 "$binary" --state-dir "$RUNNER_TEMP/registry-state" --json \
            | jq -e '.schema_version == 1 and .ok == true and (.data.session_id | startswith("ses_"))'
      - name: Publish the verified GitHub Release
        if: steps.github_release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Verify every public release byte
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          metadata="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r .tagName <<<"$metadata")" = "$TAG"
          test "$(jq -r .isDraft <<<"$metadata")" = false
          test "$(jq -r .isPrerelease <<<"$metadata")" = false
          public="$RUNNER_TEMP/public-release"
          mkdir -p "$public"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$public"
          mapfile -t assets < <(jq -r '.release_files[].name' target/release-assets/candidate-manifest.json | sort)
          find "$public" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/public-assets"
          printf '%s\n' "${assets[@]}" > "$RUNNER_TEMP/candidate-assets"
          diff -u "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/public-assets"
          for asset in "${assets[@]}"; do
            cmp "target/release-assets/$asset" "$public/$asset"
          done
      - id: tap-token
        name: Create scoped tap notification token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_SYNC_APP_PRIVATE_KEY }}
          owner: oborchers
          repositories: homebrew-tap
          permission-contents: write
      - name: Wake Homebrew tap synchronization
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_REPOSITORY: oborchers/homebrew-tap
        run: |
          gh api --method POST "repos/${TAP_REPOSITORY}/dispatches" \
            -f event_type=proqi_release_published \
            -F "client_payload[tag]=${GITHUB_REF_NAME}" \
            -F "client_payload[source_sha]=${GITHUB_SHA}"
