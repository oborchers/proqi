name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_REQUEST_BASE"
          else
            base_sha="$PUSH_BASE"
          fi

          docs_only=true
          changed_count=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            changed_count=$((changed_count + 1))
            if [[ "$path" != *.md ]]; then
              docs_only=false
            fi
          done < <(git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$HEAD_SHA")

          if [[ "$changed_count" -eq 0 ]]; then
            docs_only=false
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation gate
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed Markdown whitespace
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - name: Check public documentation assets
        run: cargo xtask assets
      - run: cargo xtask clean-worktree

  quality:
    name: Quality gate
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo xtask quality
      - run: cargo xtask clean-worktree

  test:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo xtask test
      - run: cargo xtask clean-worktree

  msrv:
    name: Minimum supported Rust
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 xtask msrv
      - name: Verify packaged source with the minimum Rust toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: cargo xtask crate-package
      - run: cargo xtask clean-worktree

  security:
    name: Dependency security and policy
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-shear@1.11.2
      - run: cargo xtask audit
      - run: cargo xtask clean-worktree

  pty:
    name: PTY smoke tests (macOS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-15
      - run: cargo xtask test-pty
      - run: cargo xtask clean-worktree

  coverage:
    name: Coverage floor
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.9.0
      - run: cargo xtask coverage
      - run: cargo xtask clean-worktree

  package:
    name: Package contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-about@0.9.2
      - run: cargo xtask package
      - run: cargo xtask crate-package
      - name: Preserve verified Linux archive for Debian packaging
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ci-linux-package
          path: target/package/proqi-x86_64-unknown-linux-gnu.tar.gz
          retention-days: 1
      - run: cargo xtask clean-worktree

  debian:
    name: Debian package contract
    needs: [changes, package]
    if: needs.changes.outputs.docs_only != 'true' && needs.package.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-22.04
      - uses: ./.github/actions/install-nfpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-linux-package
          path: target/package
      - name: Build and verify Debian artifact
        run: |
          cargo xtask debian-package \
            target/package/proqi-x86_64-unknown-linux-gnu.tar.gz \
            target/debian-package
          cargo xtask verify-debian \
            target/package/proqi-x86_64-unknown-linux-gnu.tar.gz \
            target/debian-package/proqi_amd64.deb
      - run: cargo xtask clean-worktree

  check:
    name: Required CI result
    if: always()
    needs: [changes, docs, quality, test, msrv, security, pty, coverage, package, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the documentation-only gate
        if: needs.changes.outputs.docs_only == 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '
            .changes.result == "success" and
            .docs.result == "success" and
            ([.quality, .test, .msrv, .security, .pty, .coverage, .package, .debian]
              | all(.result == "skipped"))
          ' <<<"$NEEDS")" = true
      - name: Require every product quality job
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '
            .changes.result == "success" and
            .docs.result == "skipped" and
            ([.quality, .test, .msrv, .security, .pty, .coverage, .package, .debian]
              | all(.result == "success"))
          ' <<<"$NEEDS")" = true
