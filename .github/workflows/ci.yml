name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      coverage: ${{ steps.classify.outputs.coverage }}
      documentation: ${{ steps.classify.outputs.documentation }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_msrv: ${{ steps.classify.outputs.full_msrv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_REQUEST_BASE"
          else
            base_sha="$PUSH_BASE"
          fi

          classification="$(cargo xtask ci-change-class "$base_sha" "$HEAD_SHA")"
          jq . <<<"$classification"
          {
            echo "base_sha=$base_sha"
            echo "coverage=$(jq -r .coverage <<<"$classification")"
            echo "documentation=$(jq -r '.classes | index("documentation") != null' <<<"$classification")"
            echo "docs_only=$(jq -r .docs_only <<<"$classification")"
            echo "full_msrv=$(jq -r .full_msrv <<<"$classification")"
          } >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation gate
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed Markdown whitespace
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - name: Check public documentation assets
        run: cargo xtask assets
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build and check documentation site
        run: cargo xtask docs
      - name: Preserve documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: proqi-docs-site
          path: target/docs-site/
          retention-days: 7
      - run: cargo xtask clean-worktree

  quality:
    name: Quality gate
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo xtask quality
      - run: cargo xtask clean-worktree

  test:
    name: Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo xtask test
      - name: Preserve synthetic migration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-failure-test-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/qualification-evidence/migration-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo xtask clean-worktree

  msrv:
    name: Minimum supported Rust
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum-Rust compatibility
        if: needs.changes.outputs.full_msrv != 'true'
        run: cargo +1.88.0 xtask msrv
      - name: Run full minimum-Rust diagnostic suite
        if: needs.changes.outputs.full_msrv == 'true'
        run: cargo +1.88.0 xtask msrv-full
      - name: Preserve synthetic migration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-failure-msrv-${{ github.run_attempt }}
          path: target/qualification-evidence/migration-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo xtask clean-worktree

  crate:
    name: Registry package contract
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # Packaged nested manifests are evidence, not cache workspaces.
          key: ubuntu-22.04-crate
      - run: cargo xtask crate-package
      - run: cargo xtask clean-worktree

  security:
    name: Dependency security and policy
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-shear@1.11.2
      - run: cargo xtask audit
      - run: cargo xtask clean-worktree

  pty:
    name: PTY smoke tests (macOS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-15
      - run: cargo xtask test-pty
      - name: Preserve synthetic migration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-failure-pty-${{ github.run_attempt }}
          path: target/qualification-evidence/migration-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo xtask clean-worktree

  coverage:
    name: Coverage floor
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.9.0
      - run: cargo xtask coverage
      - name: Preserve synthetic migration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-failure-coverage-${{ github.run_attempt }}
          path: target/qualification-evidence/migration-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo xtask clean-worktree

  package_linux:
    name: Package contract (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # Package output contains nested manifests that are not cache roots.
          key: ubuntu-22.04-package
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-about@0.9.2
      - uses: ./.github/actions/install-nfpm
      - name: Build and verify Linux archive
        run: cargo xtask package
      - name: Construct and statically verify Debian package
        run: |
          cargo xtask debian-package \
            target/package/proqi-x86_64-unknown-linux-gnu.tar.gz \
            target/debian-package \
            x86_64-unknown-linux-gnu
      - name: Preserve verified Linux and Debian artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ci-linux-packages
          path: |
            target/package/proqi-x86_64-unknown-linux-gnu.tar.gz
            target/debian-package/proqi_amd64.deb
            target/debian-package/proqi_amd64.deb.sha256
            target/debian-package/debian-evidence.json
          retention-days: 1
      - run: cargo xtask clean-worktree

  package_macos:
    name: Package contract (macos-15)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # Package output contains nested manifests that are not cache roots.
          key: macos-15-package
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-about@0.9.2
      - name: Build and verify macOS archive
        run: cargo xtask package
      - run: cargo xtask clean-worktree

  debian:
    name: Debian package contract (${{ matrix.profile }})
    needs: [changes, package_linux]
    if: needs.changes.outputs.docs_only != 'true' && needs.package_linux.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        profile: [ubuntu-22.04, ubuntu-24.04, debian-bookworm]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-22.04-debian
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-linux-packages
          path: target
      - name: Verify Debian artifact on ${{ matrix.profile }}
        env:
          DEBIAN_PROFILE: ${{ matrix.profile }}
        run: |
          cargo xtask verify-debian-image \
            "$DEBIAN_PROFILE" \
            target/package/proqi-x86_64-unknown-linux-gnu.tar.gz \
            target/debian-package/proqi_amd64.deb \
            target/debian-package \
            x86_64-unknown-linux-gnu
      - run: cargo xtask clean-worktree

  check:
    name: Required CI result
    if: always()
    needs: [changes, docs, quality, test, msrv, crate, security, pty, coverage, package_linux, package_macos, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the documentation-only gate
        if: needs.changes.outputs.docs_only == 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '
            .changes.result == "success" and
            .docs.result == "success" and
            ([.quality, .test, .msrv, .crate, .security, .pty, .coverage, .package_linux, .package_macos, .debian]
              | all(.result == "skipped"))
          ' <<<"$NEEDS")" = true
      - name: Require every product quality job
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '
            .changes.result == "success" and
            (if .changes.outputs.documentation == "true" then
              .docs.result == "success"
            else
              .docs.result == "skipped"
            end) and
            ([.quality, .test, .msrv, .crate, .security, .pty, .package_linux, .package_macos, .debian]
              | all(.result == "success")) and
            (if .changes.outputs.coverage == "true" then
              .coverage.result == "success"
            else
              .coverage.result == "skipped"
            end)
          ' <<<"$NEEDS")" = true
