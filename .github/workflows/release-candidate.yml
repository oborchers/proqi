name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact stable tag that this candidate will serve
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-dist@0.32.0
      - id: plan
        name: Validate tag, release notes, and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          cargo xtask release-plan "$TAG"
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          test "$conclusion" = "success"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  notices:
    name: Generate union third-party notices
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-about@0.9.2
      - name: Generate one notice set for every release target
        run: |
          mkdir -p target/release-notices
          cargo about generate about.hbs --locked --workspace --all-features \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target x86_64-unknown-linux-gnu \
            --output-file target/release-notices/THIRD-PARTY-NOTICES.md
          test -s target/release-notices/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-notices
          path: target/release-notices/THIRD-PARTY-NOTICES.md
          retention-days: 7

  crate:
    name: Verify registry package
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-22.04
      - run: cargo xtask crate-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: registry-evidence
          path: target/crate-package
          retention-days: 7

  build:
    name: Build candidate (${{ matrix.target }})
    needs: [plan, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      artifact-metadata: write # Register candidate artifacts for attestations.
      attestations: write # Publish candidate provenance and SBOM attestations.
      contents: read
      id-token: write # Sign candidate attestations with GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notices
          path: target/release-notices
      - name: Install pinned Debian packager
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/install-nfpm
      - name: Verify native runner and build installable archive
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          actual="$(rustc -vV | sed -n 's/^host: //p')"
          test "$actual" = "$EXPECTED_TARGET"
          cargo xtask package --notices target/release-notices/THIRD-PARTY-NOTICES.md
          archive="target/package/proqi-${EXPECTED_TARGET}.tar.gz"
          test -f "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SBOM=${archive}.spdx.json" >> "$GITHUB_ENV"
      - name: Generate and verify checksum
        run: |
          cargo xtask release-checksum "$ARCHIVE" > "$ARCHIVE.sha256"
          cd target/package
          shasum -a 256 -c "$(basename "$ARCHIVE").sha256"
      - name: Verify GNU/Linux runtime compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          DEBIAN_BOOKWORM_IMAGE: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
          EXPECTED_TARGET: ${{ matrix.target }}
          UBUNTU_2204_IMAGE: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
          UBUNTU_2404_IMAGE: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
        run: |
          cargo xtask verify-linux-archive "$ARCHIVE"
          extracted="$RUNNER_TEMP/proqi-linux-runtime"
          mkdir -p "$extracted"
          tar -xzf "$ARCHIVE" -C "$extracted"
          binary="$extracted/proqi-$EXPECTED_TARGET/proqi"
          expected="proqi $(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "proqi") | .version')"
          for image in "$UBUNTU_2204_IMAGE" "$DEBIAN_BOOKWORM_IMAGE" "$UBUNTU_2404_IMAGE"; do
            actual="$(docker run --rm --platform linux/amd64 \
              --mount "type=bind,src=$binary,dst=/opt/proqi,readonly" \
              "$image" /opt/proqi --version)"
            test "$actual" = "$expected"
          done
      - name: Build and verify Debian artifact from the archive binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo xtask debian-package "$ARCHIVE" target/package
          cargo xtask verify-debian "$ARCHIVE" target/package/proqi_amd64.deb
          echo "DEB=target/package/proqi_amd64.deb" >> "$GITHUB_ENV"
          echo "DEB_SBOM=target/package/proqi_amd64.deb.spdx.json" >> "$GITHUB_ENV"
      - name: Generate SPDX 2.3 JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: proqi-${{ matrix.target }}.spdx.json
          format: spdx-json
          output-file: ${{ env.SBOM }}
          path: .
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate SBOM and archive privacy
        run: |
          jq -e '.spdxVersion == "SPDX-2.3"' "$SBOM"
          if rg -n '/Users/|/home/runner|Code\.nosync|TemporaryItems' "$SBOM"; then exit 1; fi
          tar -tzf "$ARCHIVE" | sort > archive-members.txt
          test "$(wc -l < archive-members.txt | tr -d ' ')" = 7
      - name: Generate Debian SPDX 2.3 JSON SBOM
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: proqi_amd64.deb.spdx.json
          format: spdx-json
          output-file: ${{ env.DEB_SBOM }}
          file: ${{ env.DEB }}
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate Debian SBOM and checksum
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          jq -e '.spdxVersion == "SPDX-2.3"' "$DEB_SBOM"
          if rg -n '/Users/|/home/runner|Code\.nosync|TemporaryItems' "$DEB_SBOM"; then exit 1; fi
          cd target/package
          shasum -a 256 -c proqi_amd64.deb.sha256
      - name: Attest candidate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Attest candidate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ env.SBOM }}
          subject-path: ${{ env.ARCHIVE }}
      - name: Attest candidate Debian provenance
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.DEB }}
      - name: Attest candidate Debian SBOM
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ env.DEB_SBOM }}
          subject-path: ${{ env.DEB }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: candidate-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.SBOM }}
          retention-days: 7
      - name: Upload Debian candidate files
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: candidate-debian
          path: |
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256
            ${{ env.DEB_SBOM }}
            target/package/debian-evidence.json
          retention-days: 7

  assemble:
    name: Assemble immutable candidate
    needs: [plan, build, crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read # Verify candidate attestations before assembly.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: target/release-assets
          pattern: candidate-*
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-evidence
          path: target/release-assets/evidence/crate
      - name: Verify complete candidate set
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd target/release-assets
          mkdir -p evidence/debian
          mv debian-evidence.json evidence/debian/debian-evidence.json
          expected="$RUNNER_TEMP/proqi-expected-assets.txt"
          actual="$RUNNER_TEMP/proqi-actual-assets.txt"
          {
            for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
              echo "proqi-${target}.tar.gz"
              echo "proqi-${target}.tar.gz.sha256"
              echo "proqi-${target}.tar.gz.spdx.json"
            done
            echo "proqi_amd64.deb"
            echo "proqi_amd64.deb.sha256"
            echo "proqi_amd64.deb.spdx.json"
          } | sort > "$expected"
          find . -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"
          for checksum in ./*.sha256; do shasum -a 256 -c "$checksum"; done
          for sbom in ./*.spdx.json; do jq -e '.spdxVersion == "SPDX-2.3"' "$sbom"; done
          cat ./*.sha256 | sort > SHA256SUMS
          (cd evidence/crate && shasum -a 256 -c proqi-*.crate.sha256)
          jq -e --arg tag "$TAG" \
            '.schema_version == 1 and ("v" + .version) == $tag and .registry == "crates-io"' \
            evidence/crate/crate-evidence.json
          jq -e \
            '.schema_version == 1 and .package == "proqi_amd64.deb" and .maintainer_scripts == [] and (.installed_dependencies | index("libc6 (>= 2.35)"))' \
            evidence/debian/debian-evidence.json
      - name: Verify candidate attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          for artifact in target/release-assets/*.tar.gz target/release-assets/proqi_amd64.deb; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref refs/heads/main --source-digest "$SOURCE_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml" \
              --source-ref refs/heads/main --source-digest "$SOURCE_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Generate formula and candidate manifest
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cargo xtask homebrew-formula target/release-assets target/release-assets/proqi.rb
          ruby -c target/release-assets/proqi.rb
          cd target/release-assets
          release_files="$(find . -maxdepth 1 -type f ! -name candidate-manifest.json -printf '%P\n' | sort | while read -r file; do printf '%s  %s\n' "$(shasum -a 256 "$file" | cut -d ' ' -f 1)" "$file"; done | jq -Rn '[inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$")]')"
          evidence_files="$(find evidence -type f -printf '%P\n' | sort | while read -r file; do name="evidence/$file"; printf '%s  %s\n' "$(shasum -a 256 "$name" | cut -d ' ' -f 1)" "$name"; done | jq -Rn '[inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$")]')"
          jq -n --arg tag "$TAG" --arg source_sha "$SOURCE_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --argjson release_files "$release_files" --argjson evidence_files "$evidence_files" \
            '{schema_version: 2, tag: $tag, source_sha: $source_sha, build_run_id: ($run_id | tonumber), workflow: "release-candidate.yml", targets: ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"], release_files: $release_files, evidence_files: $evidence_files}' \
            > candidate-manifest.json
          jq -e '.schema_version == 2 and (.release_files | length == 14) and (.evidence_files | length == 4)' candidate-manifest.json
      - id: upload
        name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-candidate-${{ needs.plan.outputs.tag }}
          path: target/release-assets
          retention-days: 7
      - name: Summarize promotion identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          printf 'Candidate for %s\nRun: %s\nArtifact: %s\nDigest: %s\n' \
            "$TAG" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
