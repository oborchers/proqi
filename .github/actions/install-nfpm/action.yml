name: Install pinned nFPM
description: Install the audited nFPM binary used for Debian package assembly

runs:
  using: composite
  steps:
    - name: Download and verify nFPM
      shell: bash
      env:
        NFPM_VERSION: 2.47.0
        NFPM_AMD64_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        NFPM_ARM64_SHA256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/nfpm.tar.gz"
        install_root="$RUNNER_TEMP/proqi-nfpm"
        case "$(uname -m)" in
          x86_64|amd64) nfpm_arch=x86_64; expected="$NFPM_AMD64_SHA256" ;;
          arm64|aarch64) nfpm_arch=arm64; expected="$NFPM_ARM64_SHA256" ;;
          *) echo "unsupported nFPM host architecture" >&2; exit 1 ;;
        esac
        url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"

        curl \
          --proto '=https' \
          --tlsv1.2 \
          --fail \
          --location \
          --retry 3 \
          --output "$archive" \
          "$url"
        printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
        mkdir -p "$install_root/bin"
        tar --extract --gzip --file "$archive" --directory "$install_root/bin" nfpm
        chmod 0755 "$install_root/bin/nfpm"
        "$install_root/bin/nfpm" --version
        echo "$install_root/bin" >> "$GITHUB_PATH"
