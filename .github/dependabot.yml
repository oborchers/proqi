version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [dependencies]

updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: rust-toolchain
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
