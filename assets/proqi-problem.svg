<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" data-flow="proqi-to-agent">
  <title id="title">Codex and Claude Code each provide one active prompt composer</title>
  <desc id="description">An editorial illustration of Codex and Claude Code terminal sessions. Each agent is working above one active input field, while several unfinished follow-up ideas have nowhere safe to be composed.</desc>
  <rect width="1200" height="620" rx="28" fill="#0d1117"/>

  <text x="52" y="62" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700">One live input. Five unfinished prompts.</text>
  <text x="52" y="96" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">The agent is working. Where do you compose what comes next?</text>

  <g transform="translate(52 132)">
    <rect width="530" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="#75d6a0"/>
    <text x="42" y="30" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">Codex</text>
    <text x="452" y="30" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">working</text>
    <line x1="20" y1="48" x2="510" y2="48" stroke="#30363d"/>
    <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="24" y="82">• inspecting the implementation</text>
      <text x="24" y="108">• running focused tests</text>
      <text x="24" y="134">• preparing the patch</text>
    </g>
    <text x="24" y="182" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">active conversation</text>
    <rect x="20" y="204" width="490" height="92" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="2"/>
    <text x="38" y="237" fill="#75d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">›</text>
    <text x="66" y="237" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Send a message to Codex</text>
    <text x="38" y="274" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">one composer · one live stream</text>
  </g>

  <g transform="translate(618 132)">
    <rect width="530" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="#75d6a0"/>
    <text x="42" y="30" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">Claude Code</text>
    <text x="452" y="30" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">working</text>
    <line x1="20" y1="48" x2="510" y2="48" stroke="#30363d"/>
    <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="24" y="82">● reading the affected files</text>
      <text x="24" y="108">● tracing the failure path</text>
      <text x="24" y="134">● waiting on a command</text>
    </g>
    <text x="24" y="182" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">active conversation</text>
    <rect x="20" y="204" width="490" height="92" rx="10" fill="#0d1117" stroke="#6e7681" stroke-width="2"/>
    <text x="38" y="237" fill="#75d6a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">❯</text>
    <text x="66" y="237" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Send a message to Claude</text>
    <text x="38" y="274" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">one composer · one live stream</text>
  </g>

  <g transform="translate(52 482)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="218" height="54" rx="9" fill="#242930" stroke="#30363d"/>
    <text x="18" y="32" fill="#c9d1d9" font-size="14">alternative approach</text>
    <rect x="232" width="190" height="54" rx="9" fill="#242930" stroke="#30363d"/>
    <text x="250" y="32" fill="#c9d1d9" font-size="14">[Screenshot 1]</text>
    <rect x="436" width="244" height="54" rx="9" fill="#242930" stroke="#30363d"/>
    <text x="454" y="32" fill="#c9d1d9" font-size="14">follow-up for agent 2</text>
    <rect x="694" width="196" height="54" rx="9" fill="#242930" stroke="#30363d"/>
    <text x="712" y="32" fill="#c9d1d9" font-size="14">exact error text</text>
    <rect x="904" width="244" height="54" rx="9" fill="#242930" stroke="#30363d"/>
    <text x="922" y="32" fill="#c9d1d9" font-size="14">prompt for after tests</text>
  </g>

  <g aria-label="Copy or submit from Proqi to the coding agent" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="328" y="578" fill="#75d6a0" font-size="17" font-weight="700">Compose in Proqi</text>
    <path d="M506 572h120" stroke="#75d6a0" stroke-width="3" stroke-linecap="round"/>
    <path d="m614 562 13 10-13 10" fill="none" stroke="#75d6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="650" y="578" fill="#f0f6fc" font-size="17" font-weight="700">coding-agent terminal</text>
    <text x="471" y="606" fill="#8b949e" font-size="13">received follow-up only when you choose</text>
  </g>
</svg>
