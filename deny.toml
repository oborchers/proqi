[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
