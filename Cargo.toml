[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.23.1"
clap = { version = "4.5.47", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
directories = "6.0.0"
fs4 = "1.1.0"
interprocess = "=2.4.3"
ignore = "0.4.33"
linkify = "0.11.0"
png = "=0.18.1"
ropey = "1.6.1"
semver = { version = "=1.0.28", features = ["serde"] }
sha2 = "=0.11.0"
shell-words = "=1.1.1"
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std", "layout-cache", "underline-color"] }
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
ratatui-widgets = { version = "=0.3.2", default-features = false }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
signal-hook = "0.4.4"
rustix = { version = "1.1.2", features = ["fs", "process"] }
thiserror = "2.0.16"
terminal-colorsaurus = "=1.0.3"
toml = "1.1.4"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
unicode-segmentation = "1.12.0"
unicode-width = "=0.2.2"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[workspace.dependencies.kqueue]
version = "=1.2.1"

[workspace.dependencies.xattr]
version = "=1.6.1"
default-features = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
module_name_repetitions = "allow"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = []
source-tarball = false
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
unix-archive = ".tar.gz"

[package]
name = "proqi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An agent-optimized terminal scratchpad for follow-up prompts"
repository = "https://github.com/oborchers/proqi"
homepage = "https://github.com/oborchers/proqi"
readme = "README.md"
license.workspace = true
authors = ["Oliver Borchers <oliver-borchers@gmx.net>"]
keywords = ["tui", "terminal", "scratchpad", "ai-agents", "prompts"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[package.metadata.dist]
all-features = true
dist = true

[dependencies]
arboard.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
directories.workspace = true
fs4.workspace = true
interprocess.workspace = true
linkify.workspace = true
png.workspace = true
ropey.workspace = true
semver.workspace = true
sha2.workspace = true
shell-words.workspace = true
ratatui-core.workspace = true
ratatui-crossterm.workspace = true
ratatui-widgets.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
rustix.workspace = true
thiserror.workspace = true
terminal-colorsaurus.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
kqueue.workspace = true
xattr.workspace = true

[dev-dependencies]
insta = "1.43.2"
portable-pty = "0.9.0"
proptest = "1.7.0"
tempfile = "3.27.0"
vt100 = "=0.16.2"

[lints]
workspace = true

[[bin]]
name = "proqi"
path = "src/bin/proqi.rs"

[lib]
name = "proqi"
path = "src/lib.rs"
doc = false
