[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0-alpha.1"

[workspace.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = "0.28.1"
directories = "6.0.0"
fs4 = "1.1.0"
interprocess = "=2.4.2"
ropey = "1.6.1"
ratatui-core = { version = "=0.1.2", default-features = false, features = ["layout-cache", "underline-color"] }
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_28", "underline-color"] }
ratatui-widgets = { version = "=0.3.2", default-features = false }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
signal-hook = "0.3.18"
thiserror = "2.0.16"
toml = "0.9.8"
unicode-segmentation = "1.12.0"
unicode-width = "=0.2.0"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
module_name_repetitions = "allow"

[package]
name = "proqi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A terminal-native scratchpad for agent work"
repository = "https://github.com/oborchers/proqi"
publish = false

[dependencies]
arboard.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
directories.workspace = true
fs4.workspace = true
interprocess.workspace = true
ropey.workspace = true
ratatui-core.workspace = true
ratatui-crossterm.workspace = true
ratatui-widgets.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = "1.7.0"
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "proqi"
path = "src/bin/proqi.rs"
