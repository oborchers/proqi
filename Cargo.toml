[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.86"
version = "0.1.0-alpha.1"

[workspace.dependencies]
clap = { version = "4.5.47", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
ropey = "1.6.1"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
module_name_repetitions = "allow"

[package]
name = "proqi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A terminal-native scratchpad for agent work"
repository = "https://github.com/oborchers/proqi"
publish = false

[dependencies]
clap.workspace = true
directories.workspace = true
fs4.workspace = true
ropey.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = "1.7.0"
tempfile = "3.27.0"

[lints]
workspace = true

[[bin]]
name = "proqi"
path = "src/bin/proqi.rs"
